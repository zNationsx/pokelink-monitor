<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>PokeLink Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* PokeLink Monitor — página do celular. Só LÊ o resumo que o PokeLink do PC manda. */
  :root { --bg: #141417; --card: #1a1a1e; --card2: #202024; --line: #2a2a31; --txt: #e9e9ee; --mut: #8d8d98;
    --gold: #9ff06d; --frame: #39562c; --frame2: #2a2a31; --ok: #6fdc3f; --okTxt: #cfe9c0; --warn: #e4a62b; --warnTxt: #efc065;
    --roxo: #9146ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 400 15px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  body { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); min-height: 100vh; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 18px 16px 96px; display: flex; flex-direction: column; gap: 16px; }
  .t { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; letter-spacing: 1.2px; color: var(--gold); margin: 0; font-size: 18px; }
  .mut { color: var(--mut); font-size: 12px; }
  .frame { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .sp { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .mini { background: var(--card2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
  .mini small { font-size: 10px; color: var(--mut); letter-spacing: .5px; text-transform: uppercase; }
  .mini b { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .big { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: #1d2619; border: 1px solid #39562c; color: var(--okTxt); }
  .pill.warn { background: #241f16; border: 1px solid #4a3a18; color: var(--warnTxt); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .bar { height: 8px; border-radius: 99px; background: var(--card2); overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .logo { width: 40px; height: 40px; border-radius: 11px; background: #1b2418; border: 1px solid #39562c; display: grid; place-items: center; flex: none; }
  .conta { display: flex; flex-direction: column; gap: 10px; padding: 14px; text-align: left; width: 100%; cursor: pointer; }
  .conta:active { transform: translateY(1px); }
  .num { width: 32px; height: 32px; border-radius: 9px; background: #202024; border: 1px solid #33333a; display: grid; place-items: center; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 18px; color: #c9c9d1; flex: none; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(20, 20, 23, .94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
  nav.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tab { min-height: 48px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--mut); display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1px; cursor: pointer; }
  .tab.on { background: #1d2619; border-color: #39562c; color: var(--gold); }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--warn); color: #221a06; font: 700 12px Inter, sans-serif; display: grid; place-items: center; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; flex: none; }
  .sec { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .cap { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .cap:last-child { border-bottom: 0; padding-bottom: 0; }
  .img { width: 36px; height: 36px; border-radius: 8px; background: var(--card2); object-fit: contain; flex: none; image-rendering: pixelated; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 8px; border-radius: 99px; background: var(--card2); border: 1px solid var(--line); font-size: 12px; color: #c9c9d1; }
  .itens { display: flex; flex-wrap: wrap; gap: 8px; }
  .it { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px 3px 4px; border-radius: 8px; background: var(--card2); font-size: 12px; font-weight: 600; }
  .it img { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .kv span:last-child { color: var(--mut); text-align: right; }
  .aviso { display: flex; gap: 12px; padding: 12px; }
  .shiny { position: relative; overflow: hidden; padding: 16px; border-radius: 14px; border: 1px solid #39562c; background: #1b2418; }
  .shiny .estrela { position: absolute; color: #9ff06d; opacity: .25; font-size: 13px; pointer-events: none; }
  .shiny .n { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 44px; line-height: 1; color: #9ff06d; }
  .shiny .n.zero { color: #4e4e58; }
  .shiny .rot { font-family: "Barlow Condensed", sans-serif; font-weight: 700; letter-spacing: 1.2px; font-size: 14px; color: #6fdc3f; }
  .chip-sh { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: #1d2619; border: 1px solid #39562c; color: #9ff06d; }
  @media (prefers-reduced-motion: no-preference) { .shiny .estrela { animation: brilho 2.4s ease-in-out infinite; } @keyframes brilho { 50% { opacity: .15; transform: scale(.8); } } }
  /* barra de XP do treinador (igual à do jogo) */
  .xpbar { position: relative; height: 16px; border-radius: 8px; overflow: hidden; background: #202024; border: 1px solid #2f3a28; }
  .xpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#8ce85c, #6fdc3f 60%, #56b52f); }
  .xpbar span { position: relative; display: block; text-align: center; font-size: 11px; font-weight: 700; line-height: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.75); }
  .avatar { width: 44px; height: 44px; border-radius: 11px; background: var(--card2); border: 1px solid #33333a; object-fit: contain; image-rendering: pixelated; flex: none; }
  .stats { display: flex; width: 100%; border-top: 1px solid var(--line); padding-top: 10px; }
  .stats > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .stats > div + div { border-left: 1px solid var(--line); }
  .stats small { font-size: 10px; letter-spacing: .5px; color: var(--mut); }
  .stats b { font-size: 15px; }
  .msg { padding: 28px 18px; text-align: center; color: var(--mut); }
  .entrar { display: flex; flex-direction: column; gap: 14px; padding: 22px 18px; }
  .entrar input { width: 100%; min-height: 52px; padding: 0 14px; border-radius: 12px; background: var(--card2); border: 1px solid #33333a; color: var(--gold);
    font: 700 20px/1 ui-monospace, Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
  .entrar input:focus { outline: 2px solid #6fdc3f; outline-offset: 1px; }
  .go { min-height: 50px; border-radius: 12px; border: 0; background: #6fdc3f;
    color: #0f2605; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 1px; cursor: pointer; }
  .go:active { background: #80ec50; }
  .erro { color: #ff8b8b; font-size: 13px; text-align: center; }
  .sem-anim .fade, .sem-anim .shiny .estrela { animation: none !important; }
  @media (prefers-reduced-motion: no-preference) { .fade { animation: fade .18s ease-out; } @keyframes fade { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<main class="wrap" id="app"><div class="msg">Carregando...</div></main>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button class="tab on" data-tela="resumo">RESUMO</button>
  <button class="tab" data-tela="avisos">AVISOS <span class="badge" id="nAvisos" hidden></span></button>
</div></nav>
<script>
(() => {
  const DB = 'https://pokelink-monitor-default-rtdb.firebaseio.com';
  // versão desta página: ao subir um index.html novo, troque este número. O celular percebe sozinho e recarrega.
  const VERSAO_PAGINA = '7';
  async function conferirPagina() {
    try {
      const r = await fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' });
      const m = (await r.text()).match(/const VERSAO_PAGINA = '([^']+)'/);
      if (m && m[1] !== VERSAO_PAGINA) location.replace(location.pathname + '?v=' + m[1]);
    } catch (e) {}
  }
  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const urlOk = (u) => (/^(https:\/\/|data:image\/)/.test(String(u || '')) ? esc(u) : '');
  const curto = (n) => { n = Number(n) || 0; const a = Math.abs(n);
    return a >= 1e9 ? (n / 1e9).toFixed(1).replace('.', ',') + 'B' : a >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + 'M' : a >= 1e3 ? (n / 1e3).toFixed(1).replace('.', ',') + 'k' : String(Math.round(n)); };
  const ha = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`; };
  const hora = (t) => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const guarda = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };

  // o código chega pelo QR (endereço#CODIGO) ou é digitado; fica guardado neste celular
  const limpa = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  let codigo = limpa(location.hash.slice(1)) || guarda.get('pl-codigo') || '';
  if (location.hash) { if (codigo.length >= 20) guarda.set('pl-codigo', codigo); history.replaceState(null, '', location.pathname); }
  let dados = null, tela = 'resumo', conta = 0, erro = '';

  const LINK_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9ff06d" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
  const STATUS = {
    farmando: ['Farmando', 'ok'], parada: ['Sem hunt', 'warn'], carregando: ['Carregando', 'warn'], travada: ['Travada', 'warn'],
    'sem resposta': ['Sem resposta', 'warn'], 'sem login': ['Sem login', 'warn'], pausado: ['Pausado', 'warn'], fechada: ['Fechada', 'warn'],
  };
  const st = (c) => STATUS[c.status] || [c.status || '—', 'warn'];
  const corDot = (k) => (k === 'ok' ? 'var(--ok)' : 'var(--warn)');
  const corTxt = (k) => (k === 'ok' ? 'var(--okTxt)' : 'var(--warnTxt)');
  const COR_AVISO = { erro: '#e4a62b', compra: '#e4a62b', kick: '#6fdc3f', hunt: '#b89bff', shiny: '#9ff06d', pc: '#8ec5ff' };

  function telaEntrar(msg) {
    tabs.hidden = true;
    app.innerHTML = `<div class="row" style="gap:12px"><div class="logo">${LINK_SVG}</div><div><div class="t" style="font-size:24px">POKELINK</div><div class="mut">Monitor das contas</div></div></div>
      <form class="frame entrar fade" id="fEntrar">
        <label for="cod" style="font-weight:600">Código do PokeLink</label>
        <input id="cod" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD-EFGH-..." value="">
        ${msg ? `<div class="erro">${esc(msg)}</div>` : ''}
        <button class="go" type="submit">VER MINHAS CONTAS</button>
        <div class="mut" style="text-align:center;line-height:1.5">No PC, abra <b>Contas &gt; Ver no celular</b> e leia o QR code com a câmera, ou digite o código que aparece lá.</div>
      </form>`;
    document.getElementById('fEntrar').onsubmit = (e) => {
      e.preventDefault();
      const c = limpa(document.getElementById('cod').value);
      if (c.length < 20) { telaEntrar('O código tem 20 letras e números. Confira e tente de novo.'); return; }
      codigo = c; guarda.set('pl-codigo', c); dados = null; buscar(); ligarAoVivo();
    };
  }

  // dados novos chegaram (pela conexão ao vivo ou pela busca)
  function receber(j) {
    if (!j) {
      if (!dados) { pararAoVivo(); guarda.del('pl-codigo'); const c = codigo; codigo = ''; telaEntrar(`Não encontrei o código ${c.slice(0, 4)}... Confira se "Ver no celular" está ligado no PokeLink, ou se o código foi trocado.`); return; }
      erro = 'O PokeLink desligou o envio ou trocou o código.';
    } else { dados = j; erro = ''; }
    desenhar(false);
  }
  async function buscar() {
    if (!codigo) { telaEntrar(); return; }
    try {
      const r = await fetch(`${DB}/m/${codigo}.json`, { cache: 'no-store' });
      if (!r.ok) throw new Error('o servidor respondeu ' + r.status);
      receber(await r.json());
    } catch (e) { erro = 'Sem conexão: ' + e.message; desenhar(false); }
  }
  // conexão ao vivo com o Firebase: recebe cada envio do PC no mesmo segundo
  let es = null, aoVivo = false;
  function pararAoVivo() { if (es) { es.close(); es = null; } aoVivo = false; }
  function ligarAoVivo() {
    pararAoVivo();
    if (!codigo || !window.EventSource) return;
    es = new EventSource(`${DB}/m/${codigo}.json`);
    const aplicar = (ev, junta) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!m) return;
      aoVivo = true;
      if (m.path === '/') { receber(junta && dados ? Object.assign({}, dados, m.data) : m.data); return; }
      if (!dados) return;
      const partes = m.path.split('/').filter(Boolean);
      let o = dados;
      partes.slice(0, -1).forEach((k) => { o = o[k] = o[k] || {}; });
      o[partes[partes.length - 1]] = junta && m.data && typeof m.data === 'object' ? Object.assign({}, o[partes[partes.length - 1]], m.data) : m.data;
      desenhar(false);
    };
    es.addEventListener('put', (ev) => aplicar(ev, false));
    es.addEventListener('patch', (ev) => aplicar(ev, true));
    es.addEventListener('cancel', () => { pararAoVivo(); });
    es.onerror = () => { aoVivo = false; }; // o navegador tenta reconectar sozinho; enquanto isso, a busca de 30 s cobre
  }

  const quando = () => (dados && dados.at ? `${aoVivo ? '● ao vivo · ' : ''}atualizado há ${ha(Date.now() - dados.at)} (${new Date(dados.at).toLocaleTimeString('pt-BR')})` : '');
  function cabecalho() {
    const idade = dados && dados.at ? Date.now() - dados.at : Infinity;
    const limite = dados && dados.intervaloSeg ? Math.max(90000, dados.intervaloSeg * 4000) : ((dados && dados.intervalo) || 2) * 60000 * 2.5;
    const pill = dados && dados.pausado ? ['warn', 'Farm pausado'] : idade < limite ? ['ok', 'PC online'] : ['warn', 'Sem notícias'];
    return `<header class="row sp">
        <div class="row"><div class="logo">${LINK_SVG}</div><div><div class="t" style="font-size:22px;line-height:1">POKELINK</div><div class="mut">Monitor das contas</div></div></div>
        <span class="pill ${pill[0]}"><span class="dot" style="background:${corDot(pill[0])}"></span>${pill[1]}</span>
      </header>
      <p class="mut" style="margin:-8px 0 0"><span id="quando">${quando()}</span>${erro ? ` · <span style="color:var(--warnTxt)">${esc(erro)}</span>` : ''}</p>`;
  }

  // perfil do treinador: barra de XP como a do jogo
  function xpBar(p) {
    if (!p) return '';
    const pct = Math.max(0, Math.min(100, Number(p.pct) || 0));
    return `<div class="xpbar" title="${esc(Number(p.atual).toLocaleString('pt-BR'))} / ${esc(Number(p.total).toLocaleString('pt-BR'))} xp"><i style="width:${pct}%"></i><span>${curto(p.atual)} / ${curto(p.total)} xp</span></div>
      <div class="mut" style="font-size:11px;text-align:right;margin-top:2px">${pct.toLocaleString('pt-BR')}% · faltam ${curto(p.total - p.atual)} para o próximo nível</div>`;
  }
  // a mesma imagem em todas as contas não é o ícone do perfil (ex.: moeda): usa o número colorido
  const CORES_NUM = [['#1d2619', '#39562c', '#9ff06d'], ['#202430', '#33405a', '#9fc0f0'], ['#241f16', '#4a3a18', '#efc065'], ['#241a2e', '#3f2e55', '#c3a8f0']];
  const avatarIgual = () => { const im = ((dados && dados.contas) || []).map((c) => c.perfil && c.perfil.img).filter(Boolean); return im.length > 1 && new Set(im).size === 1; };
  const numCor = (c) => { const k = CORES_NUM[(Number(c.n) - 1) % 4] || CORES_NUM[0]; return `background:${k[0]};border-color:${k[1]};color:${k[2]}`; };
  const avatar = (c) => (!avatarIgual() && c.perfil && urlOk(c.perfil.img) ? `<img class="avatar" src="${urlOk(c.perfil.img)}" alt="">` : `<span class="num" style="width:44px;height:44px;font-size:22px;${numCor(c)}">${esc(c.n)}</span>`);
  // destaque dourado: shiny vistos e pegos (ACHADOS · HUNT do jogo)
  function blocoShiny(vistos, pegos, titulo, sub) {
    return `<section class="shiny fade" aria-label="Shiny: ${vistos} vistos e ${pegos} pegos">
      <span class="estrela" style="left:7%;top:14%" aria-hidden="true">✦</span><span class="estrela" style="right:5%;bottom:14%;animation-delay:.8s" aria-hidden="true">✦</span>
      <span class="estrela" style="left:46%;bottom:10%;animation-delay:1.6s" aria-hidden="true">✧</span>
      <div class="row sp" style="margin-bottom:10px"><h2 class="t" style="color:#9ff06d">✦ ${titulo}</h2><span class="mut">${sub}</span></div>
      <div class="g2" style="text-align:center">
        <div style="display:flex;flex-direction:column;gap:4px"><span class="n${vistos ? '' : ' zero'}">${vistos}</span><span class="rot">VISTOS</span></div>
        <div style="display:flex;flex-direction:column;gap:4px;border-left:1px solid #39562c"><span class="n${pegos ? '' : ' zero'}">${pegos}</span><span class="rot">PEGOS</span></div>
      </div></section>`;
  }
  function resumo() {
    const cs = dados.contas || [];
    const t = cs.reduce((a, c) => ({ ouro: a.ouro + (Number(c.ouroH) || 0), xp: a.xp + (Number(c.xpH) || 0), caps: a.caps + (Number(c.capsN) || 0) }), { ouro: 0, xp: 0, caps: 0 });
    // melhor canal da Kick (o mais perto da próxima meta)
    let kk = null;
    cs.forEach((c) => (c.kick || []).forEach((k) => { if (!kk || k.pts > kk.pts) kk = Object.assign({ conta: c.nick }, k); }));
    const metas = [[300, '+15% XP'], [500, '+15% Capture Boost'], [1000, '+15% Secret Lure']];
    const prox = kk ? metas.find((m) => kk.pts < m[0]) : null;
    const tw = cs.filter((c) => c.twitch && c.twitch.length);
    const twOn = cs.some((c) => c.twitch);
    const comShiny = cs.filter((c) => c.shiny);
    const sh = comShiny.reduce((a, c) => ({ v: a.v + (Number(c.shiny.vistos) || 0), p: a.p + (Number(c.shiny.pegos) || 0) }), { v: 0, p: 0 });
    return `${cabecalho()}
      ${comShiny.length ? blocoShiny(sh.v, sh.p, 'SHINY', 'nesta hunt · ' + comShiny.length + (comShiny.length === 1 ? ' conta' : ' contas')) : ''}
      <section class="frame sec fade">
        <div class="row sp"><h2 class="t">RITMO AGORA</h2><span class="mut">soma das ${cs.length} contas</span></div>
        <div class="g3">
          <div class="mini"><small>Ouro/h</small><span class="big" style="color:var(--gold)">${curto(t.ouro)}</span><span class="mut">lucro líquido</span></div>
          <div class="mini"><small>XP/h</small><span class="big">${curto(t.xp)}</span><span class="mut">treinador</span></div>
          <div class="mini"><small>Capturas</small><span class="big">${curto(t.caps)}</span><span class="mut">na sessão</span></div>
        </div>
      </section>
      <section style="display:flex;flex-direction:column;gap:10px">
        <h2 class="t">CONTAS</h2>
        ${cs.map((c, i) => { const s = st(c); const sh = c.shiny && (c.shiny.vistos || c.shiny.pegos); return `<button class="card conta fade" data-conta="${i}" aria-label="Ver ${esc(c.nick)}">
          <div class="row" style="width:100%;align-items:flex-start">${avatar(c)}
            <div class="grow">
              <div class="row sp" style="gap:8px;margin-bottom:5px"><b class="ell" style="font-size:16px">${esc(c.nick)}</b><span class="mut" style="font-size:13px;font-weight:600;flex:none">${c.nivel ? 'Nv ' + esc(c.nivel) : ''}</span></div>
              ${xpBar(c.perfil)}
            </div></div>
          <div class="row sp" style="width:100%;gap:8px">
            <span class="mut ell" style="font-size:13px">${c.hunt ? esc(c.hunt) : c.antigo ? 'últimos dados conhecidos' : 'sem hunt agora'}</span>
            <span class="row" style="gap:6px;font-size:12px;font-weight:600;flex:none;color:${corTxt(s[1])}"><span class="dot" style="background:${corDot(s[1])}"></span>${esc(s[0])}</span></div>
          <div class="stats">
            <div><small>OURO/H</small><b style="color:var(--gold)">${c.lucro ? esc(c.lucro.h) : '—'}</b></div>
            <div><small>XP/H</small><b>${c.xpT ? esc(c.xpT.h) : '—'}</b></div>
            <div><small>CAPTURAS</small><b>${c.capturas ? esc(c.capturas.v) : '—'}</b></div>
            <div title="Shiny vistos / pegos nesta hunt"><small style="color:var(--gold)">✦ SHINY</small><b style="color:${sh ? '#9ff06d' : 'var(--mut)'}">${c.shiny ? `${Number(c.shiny.vistos) || 0}<span style="font-size:11px;color:var(--mut)"> / </span>${Number(c.shiny.pegos) || 0}` : '—'}</b></div>
          </div></button>`; }).join('')}
      </section>
      ${kk || twOn ? `<section class="card sec fade"><h2 class="t">LIVES</h2>
        ${kk ? `<div style="display:flex;flex-direction:column;gap:6px">
          <div class="kv"><span style="font-weight:600">Kick · ${esc(kk.slug)}</span><span>${kk.pts.toLocaleString('pt-BR')}${prox ? ' / ' + prox[0] : ''}</span></div>
          <div class="bar"><i style="width:${prox ? Math.min(100, (kk.pts / prox[0]) * 100) : 100}%;background:var(--ok)"></i></div>
          <span class="mut">${esc(kk.conta)} · ${prox ? `faltam ${prox[0] - kk.pts} pontos para ${prox[1]}` : 'todas as metas já dá para resgatar'}</span></div>` : ''}
        ${twOn ? `<div class="kv" style="${kk ? 'padding-top:10px;border-top:1px solid #2a2a31' : ''}"><span style="font-weight:600">Twitch</span>
          <span style="color:${tw.length ? 'var(--okTxt)' : 'var(--mut)'}">${tw.length ? '✓ o jogo está contando o bônus' : 'nenhum bônus contando agora'}</span></div>` : ''}
      </section>` : ''}
      <div class="row" style="justify-content:center;padding-top:4px"><button class="mut" id="sair" style="background:none;border:0;text-decoration:underline;min-height:44px;cursor:pointer">Usar outro código</button></div>`;
  }

  function tileHtml(nome, t, sub) {
    return `<div class="card" style="padding:12px;display:flex;flex-direction:column;gap:2px"><span class="mut" style="letter-spacing:.6px">${nome}</span>
      <span class="big">${t ? esc(t.v) : '—'}</span><span class="mut">${t && t.h && t.h !== '0' ? esc(t.h) + ' por hora' : esc(sub || '')}</span></div>`;
  }
  function detalhe() {
    const c = (dados.contas || [])[conta];
    if (!c) { tela = 'resumo'; return resumo(); }
    const s = st(c);
    const pk = c.pk || {};
    return `<header class="row">
        <button class="icon-btn" id="voltar" aria-label="Voltar ao resumo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9ff06d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="grow"><div class="t ell" style="font-size:24px;color:var(--txt);line-height:1">${esc(c.nick)}</div>
          <div class="mut">Conta ${esc(c.n)}${c.nivel ? ' · Nível ' + esc(c.nivel) : ''}${c.modo ? ' · ' + esc(c.modo) : ''}</div></div>
        <span class="pill ${s[1]}"><span class="dot" style="background:${corDot(s[1])}"></span>${esc(s[0])}</span>
      </header>
      ${c.perfil ? `<div class="card fade" style="padding:12px;display:flex;gap:12px;align-items:center">${avatar(c)}<div class="grow">
        <div class="row sp" style="margin-bottom:5px"><span class="mut" style="letter-spacing:.6px">XP DO TREINADOR</span><b style="font-size:13px">${c.nivel ? 'Nv ' + esc(c.nivel) : ''}</b></div>${xpBar(c.perfil)}</div></div>` : ''}
      <div class="g3 fade">
        <div class="mini card"><small>Ouro</small><b style="color:var(--gold)">${esc(c.ouro || '—')}</b></div>
        <div class="mini card"><small>Gemas</small><b>${esc(c.gemas || '—')}</b></div>
        <div class="mini card"><small>Diamantes</small><b>${esc(c.diam || '—')}</b></div>
      </div>
      <section class="frame fade" style="padding:14px;display:flex;gap:14px;align-items:center">
        ${pk.img ? `<img class="img" style="width:84px;height:84px" src="${urlOk(pk.img)}" alt="">` : '<div class="img" style="width:84px;height:84px"></div>'}
        <div class="grow" style="display:flex;flex-direction:column;gap:6px">
          <span class="mut" style="letter-spacing:.6px">EM CAMPO</span>
          <span style="font-weight:700;font-size:16px">${esc(pk.nome || '—')} <span class="mut" style="font-size:13px;font-weight:500">${esc(pk.lv || '')}</span></span>
          ${pk.hp != null ? `<div class="row" style="gap:8px"><span class="mut" style="width:18px;font-size:10px">HP</span><div class="bar grow"><i style="width:${Number(pk.hp)}%;background:${pk.hp > 50 ? 'var(--ok)' : pk.hp > 20 ? 'var(--gold)' : '#ff8b8b'}"></i></div></div>` : ''}
          <span class="mut">${c.hunt ? esc(c.hunt) : 'sem hunt agora'}</span>
        </div>
      </section>
      ${c.shiny ? blocoShiny(Number(c.shiny.vistos) || 0, Number(c.shiny.pegos) || 0, 'SHINY', 'nesta hunt') : ''}
      ${(c.ativos || []).length ? `<div class="chips">${c.ativos.map((a) => `<span class="chip">${esc(a)}</span>`).join('')}</div>` : ''}
      <section style="display:flex;flex-direction:column;gap:10px">
        <div class="row sp"><h2 class="t">SESSÃO</h2><span class="mut">${c.tempo ? 'há ' + esc(c.tempo) : ''}</span></div>
        <div class="g2">${tileHtml('XP TREINADOR', c.xpT)}${tileHtml('XP POKÉMON', c.xpP)}${tileHtml('LUCRO LÍQUIDO', c.lucro, 'ouro, já sem gastos')}${tileHtml('ABATES', c.abates)}${tileHtml('CAPTURAS', c.capturas)}
          <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:6px"><span class="mut" style="letter-spacing:.6px">GASTOS</span>
            ${(c.gastos || []).length ? `<div class="itens">${c.gastos.map((g) => `<span class="it">${urlOk(g.img) ? `<img src="${urlOk(g.img)}" alt="">` : ''}${esc(g.n)}</span>`).join('')}</div>` : '<span class="mut">—</span>'}</div>
        </div>
      </section>
      <section class="card sec"><h2 class="t">ÚLTIMAS CAPTURAS</h2>
        ${(c.caps || []).length ? c.caps.map((p) => `<div class="cap">${urlOk(p.img) ? `<img class="img" src="${urlOk(p.img)}" alt="">` : '<div class="img"></div>'}
          <div class="grow"><div style="font-weight:600">${esc(p.nome)}${p.shiny ? ' <span style="color:var(--gold)">★ shiny</span>' : ''}</div><div class="mut">${esc([p.nv, p.info].filter(Boolean).join(' · '))}</div></div>
          <span class="mut">${esc(p.hora)}</span></div>`).join('') : '<span class="mut">nenhuma ainda</span>'}
      </section>
      ${(c.kick || []).length ? `<section class="card sec"><h2 class="t">PONTOS DA KICK</h2>${c.kick.map((k) => { const m = [300, 500, 1000].find((x) => k.pts < x);
        return `<div style="display:flex;flex-direction:column;gap:6px"><div class="kv"><span style="font-weight:600">${esc(k.slug)}${k.aberta ? ' <span class="mut">· assistindo</span>' : ''}</span><span>${k.pts.toLocaleString('pt-BR')}${m ? ' / ' + m : ''}</span></div>
          <div class="bar"><i style="width:${m ? Math.min(100, (k.pts / m) * 100) : 100}%;background:var(--gold)"></i></div></div>`; }).join('')}</section>` : ''}
      <section class="card sec"><h2 class="t">AUTOMÁTICOS</h2>
        <div class="kv"><span>Troca de hunt</span><span>${esc(c.troca || 'desligada')}</span></div>
        <div class="kv"><span>Auto Compra</span><span>${esc(c.auto || 'desligada')}</span></div>
        ${c.twitch ? `<div class="kv"><span>Twitch</span><span>${c.twitch.length ? 'contando em ' + esc(c.twitch.join(', ')) : 'nenhum bônus contando'}</span></div>` : ''}
        ${(c.exts || []).length ? `<div class="kv"><span>Extensões</span><span>${c.exts.map((x) => `${esc(x.nome)} ${x.ok ? '✓' : '✗'}`).join(' · ')}</span></div>` : ''}
      </section>`;
  }

  function avisos() {
    const lista = dados.avisos || [];
    guarda.set('pl-visto', String(Date.now()));
    return `<header class="row sp"><span class="t" style="font-size:26px">AVISOS</span><span class="mut">do mais novo para o mais antigo</span></header>
      ${lista.length ? lista.map((a) => `<div class="card aviso fade"><span class="dot" style="width:10px;height:10px;margin-top:5px;background:${COR_AVISO[a.tipo] || '#8d8d98'}"></span>
        <div class="grow"><div class="row sp" style="align-items:baseline"><b>${esc(a.titulo)}</b><span class="mut" style="flex:none">${a.em ? hora(a.em) : ''}</span></div>
        <div style="font-size:13px;color:#c9c9d1">${esc(a.texto)}</div></div></div>`).join('') : '<div class="card msg">Nenhum aviso por enquanto. Aqui aparecem conta travada, metas da Kick, shiny, troca de hunt e Auto Compra parada.</div>'}`;
  }

  function desenhar(anim) {
    app.classList.toggle('sem-anim', anim === false);
    if (!codigo) { telaEntrar(); return; }
    if (!dados) { app.innerHTML = `<div class="msg">${erro ? esc(erro) : 'Carregando...'}</div>`; return; }
    tabs.hidden = false;
    const visto = Number(guarda.get('pl-visto')) || 0;
    const novos = (dados.avisos || []).filter((a) => a.em > visto).length;
    const nb = document.getElementById('nAvisos');
    nb.hidden = !novos || tela === 'avisos'; nb.textContent = novos > 9 ? '9+' : String(novos);
    tabs.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tela === (tela === 'conta' ? 'resumo' : tela)));
    app.innerHTML = tela === 'avisos' ? avisos() : tela === 'conta' ? detalhe() : resumo();
    app.querySelectorAll('[data-conta]').forEach((b) => { b.onclick = () => { conta = Number(b.dataset.conta); tela = 'conta'; desenhar(); scrollTo(0, 0); }; });
    const v = document.getElementById('voltar'); if (v) v.onclick = () => { tela = 'resumo'; desenhar(); };
    const s = document.getElementById('sair'); if (s) s.onclick = () => { if (confirm('Sair deste código? Você vai precisar ler o QR code de novo.')) { pararAoVivo(); guarda.del('pl-codigo'); codigo = ''; dados = null; telaEntrar(); } };
  }
  tabs.querySelectorAll('.tab').forEach((b) => { b.onclick = () => { tela = b.dataset.tela; desenhar(); scrollTo(0, 0); }; });

  // QR lido com a página já aberta
  addEventListener('hashchange', () => {
    const c = limpa(location.hash.slice(1));
    history.replaceState(null, '', location.pathname);
    if (c.length < 20) return;
    codigo = c; guarda.set('pl-codigo', c); dados = null; tela = 'resumo'; buscar(); ligarAoVivo();
  });
  buscar();
  ligarAoVivo();
  // plano B: sem a conexão ao vivo, busca de 30 em 30 segundos
  setInterval(() => { if (!document.hidden && codigo && !aoVivo) buscar(); }, 30000);
  // o "atualizado há" anda sozinho
  setInterval(() => { const q = document.getElementById('quando'); if (q) q.textContent = quando(); }, 1000);
  conferirPagina();
  setInterval(conferirPagina, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) conferirPagina();
    if (document.hidden || !codigo) return;
    buscar();
    if (!es || es.readyState === 2) ligarAoVivo(); // voltou para a página: reconecta se caiu
  });
})();
</script>
</body>
</html>
